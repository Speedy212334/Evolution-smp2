plugins {
    id 'java'
}

group = 'me.ph4ntomgg'
version = '1.0.0'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

// Pin a stable Paper API build so dependency resolution is reproducible.
def paperApiVersion = providers.gradleProperty('paperApiVersion').getOrElse('26.3.build.242-stable')
dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            exclude 'me/ph4ntomgg/evolutionsmp/fx/CustomAnimationManager.java'
            exclude 'me/ph4ntomgg/evolutionsmp/fx/EvolutionFXPlugin.java'
            exclude 'me/ph4ntomgg/evolutionsmp/fx/EvolutionFXCommand.java'
            exclude 'me/ph4ntomgg/evolutionsmp/command/EvolutionFXCommand.java'
        }
    }
    evolutionFx {
        java {
            srcDir 'src/main/java'
            include 'me/ph4ntomgg/evolutionsmp/fx/CustomAnimationManager.java'
            include 'me/ph4ntomgg/evolutionsmp/fx/EvolutionFXPlugin.java'
            include 'me/ph4ntomgg/evolutionsmp/fx/EvolutionFXCommand.java'
        }
        resources.srcDir 'src/evolutionFx/resources'
    }
}

configurations {
    evolutionFxCompileOnly.extendsFrom compileOnly
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'EvolutionSMP'
}

tasks.register('evolutionFxJar', Jar) {
    dependsOn tasks.named('evolutionFxClasses')
    archiveBaseName = 'EvolutionFX'
    from sourceSets.evolutionFx.output
}

tasks.register('compatibilityReport') {
    doLast {
        println "EvolutionSMP ${project.version}"
        println "Java toolchain: ${java.toolchain.languageVersion.get()}"
        println "Paper API requested: ${paperApiVersion}"
        println 'Dependency resolution during compile/test is the compatibility gate.'
    }
}


tasks.register('generateResourcePack', Exec) {
    def packOutput = layout.buildDirectory.file('pack/EvolutionSMP-ResourcePack-26.3.zip')
    def detectedPython = System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3'
    def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse(detectedPython)
    inputs.file('pack/generate_resource_pack.py')
    outputs.file(packOutput)
    doFirst { packOutput.get().asFile.parentFile.mkdirs() }
    commandLine pythonExecutable, 'pack/generate_resource_pack.py', '--version', '26.3',
            '--output', packOutput.get().asFile.absolutePath
}


tasks.register('verifyArtifacts') {
    dependsOn 'jar', 'evolutionFxJar', 'generateResourcePack'
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def packFile = layout.buildDirectory.file('pack/EvolutionSMP-ResourcePack-26.3.zip').get().asFile
        if (!jarFile.exists() || jarFile.length() == 0) throw new GradleException('EvolutionSMP plugin JAR is missing or empty')
        def fxJarFile = tasks.named('evolutionFxJar').get().archiveFile.get().asFile
        if (!fxJarFile.exists() || fxJarFile.length() == 0) throw new GradleException('EvolutionFX plugin JAR is missing or empty')
        if (!packFile.exists() || packFile.length() == 0) throw new GradleException('Resource pack ZIP is missing or empty')
        def jarEntries = zipTree(jarFile).files.collect { it.name } as Set
        ['plugin.yml', 'config.yml'].each { required ->
            if (!jarEntries.contains(required)) throw new GradleException('Plugin JAR is missing ' + required)
        }
        new java.util.zip.ZipFile(fxJarFile).withCloseable { zip ->
            ['plugin.yml', 'animations.yml'].each { required ->
                if (zip.getEntry(required) == null) throw new GradleException('EvolutionFX JAR is missing ' + required)
            }
        }
        new java.util.zip.ZipFile(packFile).withCloseable { zip ->
            if (zip.getEntry('pack.mcmeta') == null) throw new GradleException('Resource pack has no pack.mcmeta')
        }
        println "Verified " + jarFile.name + " (" + jarFile.length() + " bytes)"
        println "Verified " + fxJarFile.name + " (" + fxJarFile.length() + " bytes)"
        println "Verified " + packFile.name + " (" + packFile.length() + " bytes)"
    }
}
