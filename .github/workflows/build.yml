name: EvolutionSMP 1.0.0 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Print compatibility target
        run: gradle compatibilityReport
      - name: Compile and test
        run: gradle clean test jar generateResourcePack
      - name: Upload unified plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionSMP-1.0.0
          path: |
            build/libs/EvolutionSMP-1.0.0.jar
            build/pack/EvolutionSMP-ResourcePack-26.3.zip
          if-no-files-found: error
